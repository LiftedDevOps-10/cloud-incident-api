name: Cloud Incident API CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-validate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: mvn test

      - name: Build Lambda package
        run: mvn clean package

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Get API URL
        id: api-url
        working-directory: terraform
        run: echo "url=$(terraform output -raw api_gateway_url)" >> "$GITHUB_OUTPUT"

      - name: Health Check
        run: |
          curl --fail --show-error --silent \
            "${{ steps.api-url.outputs.url }}/health"

      - name: Automated API CRUD Tests
        run: |

          API_URL="${{ steps.api-url.outputs.url }}"

          TEST_ID="CI-$(date +%s)"
          TEST_TITLE="GitHub Actions automated test $TEST_ID"

          echo "======================================"
          echo "Creating test incident"
          echo "======================================"

          curl --fail --show-error --silent \
            -X POST "$API_URL/incidents" \
            -H "Content-Type: application/json" \
            -d "{
              \"title\": \"$TEST_TITLE\",
              \"severity\": \"LOW\",
              \"status\": \"OPEN\",
              \"description\": \"Automated CI/CD CRUD test\"
            }"

          echo ""
          echo "======================================"
          echo "Finding created incident"
          echo "======================================"

          INCIDENT_ID=$(curl --fail --show-error --silent \
            "$API_URL/incidents" \
            | jq -r --arg title "$TEST_TITLE" \
              '.incidents[] | select(.title == $title) | .incidentId')

          if [ -z "$INCIDENT_ID" ] || [ "$INCIDENT_ID" = "null" ]; then
            echo "ERROR: Created incident was not found."
            exit 1
          fi

          echo "Created Incident ID: $INCIDENT_ID"

          echo ""
          echo "======================================"
          echo "Testing GET"
          echo "======================================"

          curl --fail --show-error --silent \
            "$API_URL/incidents/$INCIDENT_ID"

          echo ""
          echo "GET test passed."

          echo ""
          echo "======================================"
          echo "Testing PUT"
          echo "======================================"

          curl --fail --show-error --silent \
            -X PUT "$API_URL/incidents/$INCIDENT_ID" \
            -H "Content-Type: application/json" \
            -d '{
              "severity": "HIGH",
              "status": "RESOLVED"
            }'

          echo ""
          echo "PUT test passed."

          echo ""
          echo "======================================"
          echo "Testing DELETE"
          echo "======================================"

          curl --fail --show-error --silent \
            -X DELETE "$API_URL/incidents/$INCIDENT_ID"

          echo ""
          echo "DELETE test passed."

          echo ""
          echo "======================================"
          echo "Confirming DELETE with GET"
          echo "======================================"

          STATUS_CODE=$(curl -s \
            -o /dev/null \
            -w "%{http_code}" \
            "$API_URL/incidents/$INCIDENT_ID")

          if [ "$STATUS_CODE" != "404" ]; then
            echo "ERROR: Expected HTTP 404, got HTTP $STATUS_CODE"
            exit 1
          fi

          echo "GET after DELETE returned HTTP 404."
          echo "======================================"
          echo "ALL API CRUD TESTS PASSED"
          echo "======================================"
